name: ubuntu-home-server

networks:
  traefik-proxy:
    name: traefik-proxy
    driver: bridge
    # Pinned, and load-bearing. Containers reach host-network Home Assistant on
    # this network's gateway, and the host firewall only permits that from here:
    # `ufw allow 8123/tcp from 172.18.0.0/16`. Without the pin, `docker compose
    # down` releases the subnet and the next `up` hands out whatever is free —
    # containers then come up healthy and silently cannot reach Home Assistant.
    # See docs/network.md. The other two networks are pinned so they can't claim
    # this range first.
    ipam:
      config:
        - subnet: 172.18.0.0/16

# Include the individual docker compose files for each service.
# The list stays hand-written on purpose: it carries the one-line descriptions
# and lets a service be parked by commenting it out. `scripts/check-includes.sh`
# verifies it against the files actually in compose/.
include:
  # Applications
  - $APPLICATIONS_DIR/bambuddy.yaml # 3D printer manager
  - $APPLICATIONS_DIR/contas.yaml # Price tracking tool
  - $APPLICATIONS_DIR/excalihome.yaml # Local manage Excalidraw app
  - $APPLICATIONS_DIR/github-visualize.yaml # Dashboard that monitors your GitHub repositories
  - $APPLICATIONS_DIR/homebox.yaml # Asset organization tool
  - $APPLICATIONS_DIR/karakeep.yaml # Bookmark management tool
  - $APPLICATIONS_DIR/tally.yaml # Board games management tool

  # Arr
  - $ARR_DIR/flaresolverr.yaml # Cloudflare challenge solver for Prowlarr, routed through gluetun
  - $ARR_DIR/jellyfin.yaml # Media server
  - $ARR_DIR/prowlarr.yaml # Indexer manager for the arr apps, routed through gluetun
  - $ARR_DIR/qbittorrent.yaml # Torrent client, routed through gluetun
  - $ARR_DIR/radarr.yaml # Movie library automation, routed through gluetun
  - $ARR_DIR/sonarr.yaml # TV library automation, routed through gluetun

  # Infrastructure
  - $INFRASTRUCTURE_DIR/bark.yaml # iOS notification server
  - $INFRASTRUCTURE_DIR/cups.yaml # Printer management and airport
  - $INFRASTRUCTURE_DIR/gluetun.yaml # VPN tunnel shared by other containers
  - $INFRASTRUCTURE_DIR/portainer.yaml # Docker management UI
  - $INFRASTRUCTURE_DIR/traefik.yaml # Domain routing, reverse proxy and certificate manager
  - $INFRASTRUCTURE_DIR/uptimekuma.yaml # Uptime monitoring

  # IoT
  - $IOT_DIR/easy-mqtt.yaml # Local MQTT broker with dynasec UI
  - $IOT_DIR/esphome.yaml # Manage ESPhome devices
  - $IOT_DIR/homeassistant.yaml # Home automation powerhouse
  - $IOT_DIR/matter-server.yaml # Local Matter broker
  # - $IOT_DIR/music-assistant.yaml # Centralize media manager
  - $IOT_DIR/piper.yaml # Home Assistant Voice Piper text to speech
  - $IOT_DIR/speech-to-phrase.yaml # Home Assistant Voice speech to text
  - $IOT_DIR/whisper.yaml # Whisper (faster-whisper) STT (Wyoming)
  - $IOT_DIR/zigbee2mqtt.yaml # Zigbee coordinator
  - $IOT_DIR/zone-configurator.yaml # Everything Smart Home mmWave Manager
