# MQTT Broker with nice UI

services:
  easy-mqtt:
    container_name: easy-mqtt
    image: ghcr.io/lukanrocks/easy-mqtt:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
      - COOKIE_SECURE=true
    volumes:
      - $DOCKER_DATA_DIR/easy-mqtt:/data
    networks:
      - traefik-proxy
    ports:
      - 1883:1883 # LAN-wide: IoT devices and Home Assistant (host-network) connect here
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.easy-mqtt.rule=Host(`mqtt.homeserver.lukan.rocks`)
      - traefik.http.services.easy-mqtt.loadbalancer.server.port=80
