# Everything Smart Home mmWave presence sensor zone editor
# image: everythingsmarthome/everything-presence-mmwave-configurator

services:
  zone-configurator:
    container_name: zone-configurator
    image: everythingsmarthome/everything-presence-mmwave-configurator:2.2.4
    restart: unless-stopped
    depends_on:
      - homeassistant
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    env_file: # Password and Secrets only file
      - $DOCKER_SECRETS_DIR/zone-configurator_secrets
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/zone-configurator:/config
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:42069/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.zone-configurator.rule=Host(`esh.homeserver.lukan.rocks`)
      - traefik.http.services.zone-configurator.loadbalancer.server.port=42069
