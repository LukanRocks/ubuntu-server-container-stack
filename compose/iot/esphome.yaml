# Manage ESPhome devices

services:
  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:2026.8.1
    restart: unless-stopped
    privileged: true
    network_mode: host
    security_opt:
      - no-new-privileges:true
    env_file: # Password and Secrets only file
      - $DOCKER_SECRETS_DIR/esphome_secrets
    volumes:
      - $DOCKER_DATA_DIR/esphome:/config:rw
      - $LOCALTIME_MOUNT:ro
    # healthcheck: image ships its own (curl --fail http://localhost:6052/version)
    labels:
      - traefik.enable=true
      - traefik.http.routers.esphome.rule=Host(`esphome.homeserver.lukan.rocks`)
      - traefik.http.services.esphome.loadbalancer.server.port=6052
