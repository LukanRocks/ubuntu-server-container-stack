# Local Matter broker - https://github.com/home-assistant-libs/python-matter-server

services:
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined # required: the Matter SDK needs to write to /sys for Bluetooth commissioning
    volumes:
      - $DOCKER_DATA_DIR/matter-server:/data:rw
      - $DOCKER_SOCK_MOUNT:ro
    healthcheck: # image has curl, not wget
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5580/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3