# Music Assistant is a media library manager that connects streaming services to connected speakers. - https://www.music-assistant.io/installation/

services:
  music-assistant-server:
    container_name: music-assistant-server
    image: ghcr.io/music-assistant/server:2.9.8
    restart: unless-stopped
    depends_on:
      - homeassistant
    privileged: true
    network_mode: host
    security_opt:
      - apparmor=unconfined # no no-new-privileges: needs SYS_ADMIN/DAC_READ_SEARCH below
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/music-assistant-server:/data/:rw
    # TODO: verify wget is available in this image and confirm the UI port, then enable
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8095/"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 30s
    #   retries: 3
    # Not Traefik-routed: network_mode: host, accessed directly on the LAN
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
