# Piper — neural text-to-speech (Wyoming) for Home Assistant

services:
  piper:
    container_name: piper
    image: rhasspy/wyoming-piper:2.4.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/piper:/data   # downloaded voices
    networks:
      - traefik-proxy
    ports:
      # Only Home Assistant reaches this, and it runs host-network with no
      # Docker DNS — so publish on loopback and let its extra_hosts alias
      # `piper` to 127.0.0.1. Loopback-only, so nothing on the LAN can connect.
      - 127.0.0.1:10200:10200
    healthcheck: # Wyoming is TCP-only (no HTTP); python3 is the only tool in this image
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',10200),timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 60s # first run downloads the voice
      retries: 3
    command:
      - --voice
      - en_US-lessac-medium