# Prowlarr holds one set of indexer definitions and syncs them into Radarr and Sonarr
# https://docs.linuxserver.io/images/docker-prowlarr/
# It talks to trackers and indexers, so it belongs behind the tunnel by the rule in
# docs/network.md. Sharing gluetun's netns is also what lets its app sync work: Radarr and
# Sonarr are tenants too, so it reaches them on 127.0.0.1 with no Docker DNS involved.

services:
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166
    restart: unless-stopped
    depends_on:
      gluetun: # declared in compose/infrastructure/gluetun.yaml, merged in by include:
        condition: service_healthy # no tunnel, no traffic — wait for it
    network_mode: service:gluetun # recreating gluetun orphans this netns: recreate this too
    security_opt:
      - no-new-privileges:true
    # No env_file: Prowlarr generates its own API key into /config/config.xml on first start.
    environment: # General configurations
      - TZ=$TZ
      - PUID=1000
      - PGID=1000
    volumes:
      - $DOCKER_DATA_DIR/prowlarr:/config:rw
      # No library mount: Prowlarr manages indexer definitions and never touches the NAS.
    # No networks/ports: network_mode: service:gluetun owns both.
    healthcheck: # lsio images ship curl but no HEALTHCHECK; this runs inside gluetun's netns
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels: # Traefik follows network_mode: service: back to gluetun for the IP
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.homeserver.lukan.rocks`)
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
