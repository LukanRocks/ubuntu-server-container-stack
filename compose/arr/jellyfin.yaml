# Jellyfin is my media server - https://jellyfin.org/docs/general/installation/container
# Shared with friends through a dedicated Tailscale node - https://tailscale.com/kb/1282/docker

services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:12.2.20261005-225228
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
      # Lets Jellyfin hand clients the right external address
      - JELLYFIN_PublishedServerUrl=https://jellyfin.homeserver.lukan.rocks
    volumes:
      - $DOCKER_DATA_DIR/jellyfin/config:/config:rw
      - $DOCKER_DATA_DIR/jellyfin/cache:/cache:rw
      # Writable so Jellyfin can save artwork and NFO metadata next to the media
      # (Dashboard > Libraries > the library > Save artwork into media folders).
      # :rw here is not enough on its own — these are NAS shares, so the `rw`
      # flag in /etc/fstab is what actually grants it.
      - $DOCKER_MOUNTS_DIR/movies:/media/movies:rw
      - $DOCKER_MOUNTS_DIR/shows:/media/shows:rw
    networks:
      - traefik-proxy
    # No ports: Traefik fronts the web UI. Client autodiscovery (7359/udp) needs
    # host networking to receive LAN broadcasts, so point clients at the URL.
    # healthcheck: image ships its own (curl $HEALTHCHECK_URL, http://localhost:8096/health)
    # Hardware transcoding (Intel VAAPI). Also needs enabling under Dashboard > Playback > Transcoding.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.homeserver.lukan.rocks`)
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096

  jellyfin-tailscale:
    container_name: jellyfin-tailscale
    image: tailscale/tailscale:v1.102.5
    restart: unless-stopped
    depends_on:
      - jellyfin
    security_opt:
      - no-new-privileges:true
    env_file: # Passwords and Secrets only file
      - $DOCKER_SECRETS_DIR/jellyfin-tailscale_secrets # TS_AUTHKEY=tskey-auth-... (tagged, e.g. tag:jellyfin)
    environment: # General configurations
      - TS_HOSTNAME=jellyfin # -> https://jellyfin.<tailnet>.ts.net
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true # no /dev/net/tun or NET_ADMIN needed; serve works in userspace
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    volumes:
      - $DOCKER_DATA_DIR/jellyfin-tailscale:/var/lib/tailscale:rw # node identity, keep it or the node re-registers
      - $DOCKER_CONFIG_DIR/jellyfin-tailscale:/config:ro
    networks:
      - traefik-proxy # reaches jellyfin:8096 by Docker DNS
    # No ports: single NAT (ISP router bridged), so NAT traversal gets direct
    # connections. If `tailscale status` shows DERP while a friend streams, pin
    # TS_TAILSCALED_EXTRA_ARGS=--port=41641 and publish/forward 41641/udp.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # No traefik.* labels: reached over the tailnet, not through Traefik.
    # Share the node from the admin console (Machines > jellyfin > Share) so the
    # friend sees only this node, not the rest of the tailnet.
