# Sonarr automates the TV library - https://docs.linuxserver.io/images/docker-sonarr/
# It has no network stack of its own: everything goes through gluetun, so it reaches
# qBittorrent, Radarr and Prowlarr on 127.0.0.1. See docs/network.md.

services:
  sonarr:
    container_name: sonarr
    # -ls2 is not a typo: linuxserver reset the ls counter for this image after -ls329.
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls2
    restart: unless-stopped
    depends_on:
      gluetun: # declared in compose/infrastructure/gluetun.yaml, merged in by include:
        condition: service_healthy # no tunnel, no traffic — wait for it
    network_mode: service:gluetun # recreating gluetun orphans this netns: recreate this too
    security_opt:
      - no-new-privileges:true
    # No env_file: Sonarr generates its own API key into /config/config.xml on first start.
    environment: # General configurations
      - TZ=$TZ
      - PUID=1000 # matches uid=1000 on the CIFS mount, so imports land as lukanvanderlinde
      - PGID=1000
    volumes:
      - $DOCKER_DATA_DIR/sonarr:/config:rw
      # The WHOLE share in one bind, not just Shows. Importing hardlinks the download out of
      # /data/Torrents into /data/Shows, and hardlinks cannot cross a mount point — split
      # this up and Sonarr silently copies instead. Root folder is /data/Shows.
      # Nothing is created on the NAS by this: /data is the container-side name for the share,
      # whose layout stays library/{Movies,Shows,Torrents,...}. See docs/storage.md.
      - $DOCKER_LIBRARY_MOUNT_DIR:/data:rw
    # No networks/ports: network_mode: service:gluetun owns both.
    healthcheck: # lsio images ship curl but no HEALTHCHECK; this runs inside gluetun's netns
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels: # Traefik follows network_mode: service: back to gluetun for the IP
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.homeserver.lukan.rocks`)
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    # Never configure a remote path mapping. qBittorrent reports a download at
    # /data/Torrents/shows/... and that exact string resolves here, because both containers
    # bind the same single CIFS mount — a mapping can only break it.
