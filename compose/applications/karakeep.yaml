# Karakeep is a bookmark links service - https://github.com/karakeep-app/karakeep

services:
  karakeep:
    container_name: karakeep
    image: ghcr.io/karakeep-app/karakeep:0.32.0
    restart: unless-stopped
    depends_on:
      chrome:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    env_file: # Passwords and Secrets only file
      - $DOCKER_SECRETS_DIR/karakeep_secrets
      - $DOCKER_SECRETS_DIR/meilisearch_secrets
    environment: # General configurations
      - TZ=$TZ
      - DATA_DIR=/data  # ! DON'T CHANGE THIS
      - DISABLE_SIGNUPS=true
      - NEXTAUTH_URL=https://karakeep.homeserver.lukan.rocks
      - MEILI_ADDR=http://meilisearch:7700
      - BROWSER_WEB_URL=http://chrome:9222
      # - OPENAI_API_KEY= look ollama implementation
    volumes:
      - $DOCKER_DATA_DIR/karakeep:/data
    networks:
      - traefik-proxy      # front door, for Traefik
      - karakeep-internal  # chrome + meilisearch
    # healthcheck: image ships its own (wget --spider http://127.0.0.1:3000/api/health)
    labels:
      - traefik.enable=true
      - traefik.http.routers.karakeep.rule=Host(`karakeep.homeserver.lukan.rocks`)
      - traefik.http.services.karakeep.loadbalancer.server.port=3000

  chrome:
    container_name: karakeep-chrome
    image: gcr.io/zenika-hub/alpine-chrome:123
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - karakeep-internal # renders untrusted pages, so keep it off traefik-proxy
    healthcheck: # 127.0.0.1, not localhost — chrome binds IPv4 only
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9222/json/version"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars

  meilisearch:
    container_name: karakeep-meilisearch
    image: getmeili/meilisearch:v1.11.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: # Passwords and Secrets only file
      - $DOCKER_SECRETS_DIR/meilisearch_secrets
    environment: # General configurations
      - MEILI_NO_ANALYTICS=true
    volumes:
      - $DOCKER_DATA_DIR/meilisearch:/meili_data
    networks:
      - karakeep-internal # only karakeep talks to it
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# Private to this stack, so it's declared here rather than in the root file.
# Not `internal: true` — chrome has to reach the public internet to render
# the pages being bookmarked.
networks:
  karakeep-internal:
    name: karakeep-internal
    driver: bridge
