# Homebox allows to keep track of all my stuff - https://homebox.software/en/quick-start/

services:
  homebox:
    container_name: homebox
    image: ghcr.io/sysadminsmedia/homebox:0.26.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: # Password and Secrets only file
      - $DOCKER_SECRETS_DIR/homebox_secrets # Provides HBOX_AUTH_API_KEY_PEPPER. Required. Server-side secret HMAC-keyed into stored API key hashes; the binary refuses to start if this is shorter than 32 bytes. Generate with openssl rand -base64 48. Must stay stable across restarts — rotating it invalidates every issued API key.
    environment: # General configurations
      - TZ=$TZ
      - HBOX_MODE=production
      - HBOX_OPTIONS_ALLOW_ANALYTICS=false
      - HBOX_OPTIONS_ALLOW_REGISTRATION=false
      - HBOX_OPTIONS_AUTO_INCREMENT_ASSET_ID=true
      - HBOX_OPTIONS_TRUST_PROXY=true
      - HBOX_LOG_LEVEL=warn # trace, debug, info, warn, error, critical
    volumes:
      - $DOCKER_DATA_DIR/homebox:/data:rw
    networks:
      - traefik-proxy
    # healthcheck: image ships its own (wget -O - http://localhost:7745/api/v1/status)
    labels:
      - traefik.enable=true
      - traefik.http.routers.homebox.rule=Host(`homebox.homeserver.lukan.rocks`)
      - traefik.http.services.homebox.loadbalancer.server.port=7745
