# Dashboard that monitors your GitHub repositories

services:
  github-visualize:
    container_name: github-visualize
    image: akitaonrails/github-visualize:0.2.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: # Password and Secrets only file
      - $DOCKER_SECRETS_DIR/github_visualize_secrets
    environment:
      - APP_TIME_ZONE=$TZ
      - SOLID_QUEUE_IN_PUMA=1
      - GITHUB_OWNER=LukanRocks
    volumes:
      - $DOCKER_DATA_DIR/github-visualize:/rails/storage
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/up"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.github-visualize.rule=Host(`ghv.homeserver.lukan.rocks`)
      - traefik.http.services.github-visualize.loadbalancer.server.port=80