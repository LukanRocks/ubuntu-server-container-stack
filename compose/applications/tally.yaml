# My boardgames manager - https://github.com/LukanRocks/tally

services:
  tally:
    container_name: tally
    image: ghcr.io/lukanrocks/tally:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKER_DATA_DIR/tally:/app/data:rw
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.tally.rule=Host(`tally.homeserver.lukan.rocks`)
      - traefik.http.services.tally.loadbalancer.server.port=3000