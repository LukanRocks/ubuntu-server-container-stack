# Local manage Excalidraw app - https://github.com/LukanRocks/excalihome

services:
  excalihome:
    container_name: excalihome
    image: ghcr.io/lukanrocks/excalihome:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKER_DATA_DIR/excalihome:/app/data:rw
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.excalihome.rule=Host(`excalihome.homeserver.lukan.rocks`)
      - traefik.http.services.excalihome.loadbalancer.server.port=3000
