# Bambu Lab 3D printer manager - image: ghcr.io/maziggy/bambuddy

services:
  bambuddy:
    container_name: bambuddy
    image: ghcr.io/maziggy/bambuddy:1.2.5.3
    restart: unless-stopped
    network_mode: host  # Recommended for automatic printer discovery
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
      - BAMBUDDY_EXTERNAL_ROOTS=/external/3d-printing
    volumes:
      - $DOCKER_DATA_DIR/bambuddy:/app/data
      - $DOCKER_LOGS_DIR/bambuddy:/app/logs
      - $DOCKER_MOUNTS_DIR/3d-printing:/external/3d-printing
    # healthcheck: image ships its own (python urllib against http://localhost:8000/health)
    labels:
      - traefik.enable=true
      - traefik.http.routers.bambuddy.rule=Host(`bambuddy.homeserver.lukan.rocks`)
      - traefik.http.services.bambuddy.loadbalancer.server.port=8000
