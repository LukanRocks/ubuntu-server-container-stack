# Gluetun holds a VPN tunnel that other containers share a network stack with.
# Surfshark over WireGuard - https://github.com/passteque/gluetun
# Which services belong behind it, and why Jellyfin doesn't: docs/network.md

services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:v3.41.3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true # fine next to cap_add: capabilities are granted at start
    env_file: # Password and Secrets only file
      - $DOCKER_SECRETS_DIR/gluetun_secrets # Provides WIREGUARD_PRIVATE_KEY.
    environment:
      - TZ=$TZ
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_ADDRESSES=10.14.0.2/16 # The Address line of Surfshark. Identical on every server, so not a secret.
      - SERVER_COUNTRIES=United States,Argentina,Chile # gluetun picks among Surfshark's servers in these
      - UPDATER_PERIOD=24h # keep the bundled Surfshark server list fresh
      - DOT=on # DNS over TLS, so tenant lookups don't leak to the ISP resolver
      - FIREWALL_INPUT_PORTS=8080,7878,8989,9696 # qbittorrent, radarr, sonarr, prowlarr
    volumes:
      - $DOCKER_DATA_DIR/gluetun:/gluetun:rw
    networks:
      - traefik-proxy # No ports: Traefik reaches each tenant on this container's traefik-proxy IP
    # healthcheck: image ships its own (gluetun-entrypoint healthcheck, pings through the tunnel)
    # No traefik.* labels: gluetun has no web UI.
    # No VPN_PORT_FORWARDING: Surfshark doesn't offer it. See the Seeding note in compose/arr/qbittorrent.yaml.
    cap_add:
      - NET_ADMIN # required: creates the wireguard interface and the kill-switch firewall
    devices:
      - /dev/net/tun:/dev/net/tun # required: the tunnel device
