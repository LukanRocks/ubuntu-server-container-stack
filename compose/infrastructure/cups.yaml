# Printer management

services:
  cups:
    container_name: cups
    image: chuckcharlie/cups-avahi-airprint:2.1.3
    restart: unless-stopped
    network_mode: host # required: AirPrint discovery needs multicast/mDNS on the LAN
    security_opt:
      - no-new-privileges:true
    env_file: # Password and Secrets only file
      - $DOCKER_SECRETS_DIR/cups_secrets
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/cups:/config
    healthcheck: # image has wget, not curl
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:631/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Not Traefik-routed: network_mode: host, accessed directly on the LAN at :631
