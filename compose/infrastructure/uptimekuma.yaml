# UptimeKuma allows me to easily check the status of my services. - https://github.com/louislam/uptime-kuma

services:
  uptimekuma:
    container_name: uptimekuma
    image: louislam/uptime-kuma:1.23.17
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/uptimekuma:/app/data:rw
    networks:
      - traefik-proxy
    # healthcheck: image ships its own (extra/healthcheck, a compiled Go binary, start_period 180s)
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptimekuma.rule=Host(`uptimekuma.homeserver.lukan.rocks`)
      - traefik.http.services.uptimekuma.loadbalancer.server.port=3001
