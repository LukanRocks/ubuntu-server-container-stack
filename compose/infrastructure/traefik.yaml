# Traefik handles the reverse proxy and certificates validation. - https://doc.traefik.io/traefik/

services:
  traefik:
    container_name: traefik
    image: docker.io/library/traefik:v3.7.7
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    env_file: # Passwords and Secrets only file
      - $DOCKER_SECRETS_DIR/traefik_secrets
    volumes:
      - $DOCKER_SOCK_MOUNT:ro
      - $LOCALTIME_MOUNT:ro
      - $DOCKER_CONFIG_DIR/traefik/config.yaml:/etc/traefik/traefik.yaml:ro
      - $DOCKER_CONFIG_DIR/traefik/dynamic:/etc/traefik/dynamic:ro
      - $DOCKER_SECRETS_DIR/traefik_users:/run/secrets/traefik_users:ro # bcrypt htpasswd for the dashboard
      - $DOCKER_DATA_DIR/letsencrypt:/letsencrypt:rw
      - $DOCKER_LOGS_DIR/traefik:/var/log/traefik:rw
    healthcheck: # requires `ping: {}` in config/traefik/config.yaml
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    # No traefik.* labels: the dashboard is routed from
    # config/traefik/dynamic/traefik-dashboard.yaml instead. See the comment
    # there for why labels don't work for Traefik's own internal service.