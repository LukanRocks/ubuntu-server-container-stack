# iOS notification server

services:
  bark:
    container_name: bark
    image: ghcr.io/finb/bark-server:v2.3.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/bark:/data
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.bark.rule=Host(`bark.homeserver.lukan.rocks`)
      - traefik.http.services.bark.loadbalancer.server.port=8080
