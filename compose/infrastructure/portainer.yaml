# Portainer allows me to quickly manage my containers though a great UI. - https://docs.portainer.io/

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.39.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_SOCK_MOUNT:rw
      - $DOCKER_DATA_DIR/portainer:/data:rw
    networks:
      - traefik-proxy
    # healthcheck: not possible — image is distroless (no shell, wget or curl); monitor externally via uptimekuma
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.homeserver.lukan.rocks`)
      - traefik.http.services.portainer.loadbalancer.server.port=9000
